<!doctype html>
<html lang="en" data-theme="neon">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Cascade</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2307041a'/%3E%3Cpolygon points='50,14 86,50 50,86 14,50' fill='none' stroke='%2300f0ff' stroke-width='8'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the saved theme before first paint to avoid a flash of the default theme.
      try {
        var t = JSON.parse(localStorage.getItem('neon-cascade:settings') || '{}').theme;
        if (typeof t === 'string') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <main class="app">
      <header class="hud">
        <h1 class="title">Neon<span>Cascade</span></h1>
        <div class="stats">
          <div class="stat"><span class="label">Score</span><span id="score" class="value">0</span></div>
          <div class="stat"><span class="label">Best</span><span id="best" class="value">0</span></div>
        </div>
      </header>

      <div class="board-wrap">
        <div id="board" class="board" role="grid" aria-label="Game board"></div>
        <div id="toast" class="toast" aria-live="polite"></div>
      </div>

      <footer class="controls">
        <button id="hint" type="button">Hint</button>
        <button id="new-game" type="button">New game</button>
        <button id="open-settings" type="button" aria-haspopup="dialog">Settings</button>
      </footer>
    </main>

    <dialog id="settings" class="settings" aria-labelledby="settings-title">
      <form method="dialog" class="settings-panel">
        <header class="settings-header">
          <h2 id="settings-title">Settings</h2>
          <button class="close-btn" value="close" aria-label="Close settings">&times;</button>
        </header>

        <section class="settings-section">
          <h3>Theme</h3>
          <div id="theme-options" class="theme-grid" role="radiogroup" aria-label="Theme"></div>
        </section>

        <footer class="settings-footer">
          <button value="close">Done</button>
        </footer>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
