<!doctype html>
<html lang="en" data-theme="neon">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Cascade</title>
    <!-- Icons and home-screen metadata live in public/ (see README "App icons").
         Root-absolute hrefs are rewritten to relative ones by Vite (base: './'). -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Neon Cascade" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <script>
      // Apply the saved theme before first paint to avoid a flash of the default theme.
      try {
        var t = JSON.parse(localStorage.getItem('neon-cascade:settings') || '{}').theme;
        if (typeof t === 'string') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <main class="app">
      <header class="hud">
        <h1 class="title">Neon<span>Cascade</span></h1>
        <div class="stats">
          <div class="stat"><span class="label">Score</span><span id="score" class="value">0</span></div>
          <div class="stat"><span class="label">Best</span><span id="best" class="value">0</span></div>
        </div>
      </header>

      <div class="board-wrap">
        <div id="board" class="board" role="grid" aria-label="Game board"></div>
        <div id="toast" class="toast" aria-live="polite"></div>
      </div>

      <footer class="controls">
        <button id="hint" type="button">Hint</button>
        <button id="new-game" type="button">New game</button>
        <button id="open-settings" type="button" aria-haspopup="dialog">Settings</button>
      </footer>
    </main>

    <dialog id="settings" class="settings" aria-labelledby="settings-title">
      <form method="dialog" class="settings-panel">
        <header class="settings-header">
          <h2 id="settings-title">Settings</h2>
          <button class="close-btn" value="close" aria-label="Close settings">&times;</button>
        </header>

        <section class="settings-section">
          <h3>Theme</h3>
          <div id="theme-options" class="theme-grid" role="radiogroup" aria-label="Theme"></div>
        </section>

        <footer class="settings-footer">
          <button value="close">Done</button>
        </footer>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
